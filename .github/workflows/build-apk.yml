name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android project
        run: npx cap add android

      - name: Set app icon
        continue-on-error: true
        run: |
          pip install pillow
          python3 - <<'PY'
          import os, shutil
          from PIL import Image, ImageDraw
          def icon(size):
              im = Image.new("RGBA", (size, size), (0, 0, 0, 0)); d = ImageDraw.Draw(im)
              d.rounded_rectangle([0, 0, size - 1, size - 1], radius=size * 0.22, fill="#c9457c")
              pad = size * 0.12; w = size - 2 * pad
              x0, y0, x1, y1 = pad, pad + w * 0.30, pad + w, pad + w
              d.rounded_rectangle([x0, y0 + w * 0.12, x1, y1], radius=w * 0.06, fill="#ffffff")
              d.rounded_rectangle([x0 - w * 0.03, y0, x1 + w * 0.03, y0 + w * 0.2], radius=w * 0.05, fill="#fbe3ee")
              rw = w * 0.14; cx = (x0 + x1) / 2
              d.rectangle([cx - rw / 2, y0, cx + rw / 2, y1], fill="#c9457c")
              r = w * 0.17; lw = int(w * 0.06)
              d.ellipse([cx - r * 1.9, y0 - r * 1.5, cx - r * 0.1, y0 + r * 0.4], outline="#ffffff", width=lw)
              d.ellipse([cx + r * 0.1, y0 - r * 1.5, cx + r * 1.9, y0 + r * 0.4], outline="#ffffff", width=lw)
              d.ellipse([cx - r * 0.45, y0 - r * 0.5, cx + r * 0.45, y0 + r * 0.4], fill="#ffffff")
              return im
          res = "android/app/src/main/res"
          for dn, sz in [("mdpi", 48), ("hdpi", 72), ("xhdpi", 96), ("xxhdpi", 144), ("xxxhdpi", 192)]:
              for n in ["ic_launcher", "ic_launcher_round", "ic_launcher_foreground"]:
                  icon(sz).save(f"{res}/mipmap-{dn}/{n}.png")
          shutil.rmtree(f"{res}/mipmap-anydpi-v26", ignore_errors=True)
          PY

      - name: Sync web files
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk podaraci.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Podaraci APK v${{ github.run_number }}
          files: podaraci.apk
